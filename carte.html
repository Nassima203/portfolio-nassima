<body class="dc-body">

<!-- SVG filter reused from the main site for the watercolor blobs -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="wc-blob-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="55" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
</svg>

<main class="dc-page">
  <div class="paint-blob pb-blue" aria-hidden="true" style="top:-60px; left:-80px; width:280px; height:280px;"></div>
  <div class="paint-blob pb-blush" aria-hidden="true" style="bottom:-60px; right:-70px; width:260px; height:260px;"></div>

  <a href="index.html" class="dc-back">← Retour au portfolio</a>

      <span class="dc-photo-fallback">NA</span>
    </div>

    <h1 class="dc-name">Nassima Adli</h1>
    <p class="dc-role">Développeuse Web <span class="highlight">Fullstack</span></p>

    <div class="dc-socials">
